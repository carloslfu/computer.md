name: CLI tests

# Per-PR fast path (F10): unit + golden + fuzz must finish in <30s.
# Nightly + on-tag: also runs F7 (integration) and F8 (agent smoke,
# which is included in the standard cmd test pass but needs the binary
# built first).

on:
  pull_request:
    paths:
      - "cli/**"
      - "llms.txt"
      - ".github/workflows/cli-test.yml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "llms.txt"
      - ".github/workflows/cli-test.yml"
  schedule:
    # Nightly at 09:00 UTC — runs the integration suite that's too
    # expensive for every PR.
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit + golden + fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Sync llms.txt into binary embed dir
        run: cp llms.txt cli/cmd/llms_embed.txt

      - name: Build the binary (so SIGINT/smoke tests can exec it)
        working-directory: cli
        run: go build -o vibecraft .

      - name: Unit tests
        working-directory: cli
        run: go test ./... -timeout=2m -count=1

      - name: Fuzz output for 10s
        working-directory: cli
        run: go test -run=^$ -fuzz=FuzzEmitArbitraryData -fuzztime=10s ./output/...

      - name: Docs-check (every cobra verb must appear in llms.txt)
        working-directory: cli
        run: make docs-check

  integration:
    name: Integration (real CLI vs stub daemon)
    runs-on: ubuntu-latest
    needs: [unit]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum
      - name: Sync llms.txt
        run: cp llms.txt cli/cmd/llms_embed.txt
      - name: Build the binary
        working-directory: cli
        run: go build -o vibecraft .
      - name: Integration suite
        working-directory: cli
        run: go test -tags=integration ./integration/... -timeout=5m

  install-script:
    name: Install script (Ubuntu / Debian / Alpine / macOS)
    runs-on: ${{ matrix.os }}
    needs: [unit]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: install.sh syntax check (sh)
        run: sh -n install/cli.sh

      - name: install.sh syntax check (bash)
        run: bash -n install/cli.sh

      # The full install.sh-pulls-from-production smoke isn't run here
      # because it depends on a freshly published release with the new
      # manifest format. The release pipeline (release.yml) does its
      # own post-publish smoke. This job just guards against shell
      # regressions in install/cli.sh itself.
